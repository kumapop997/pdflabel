<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>PDFラベルメーカー</title>
<style>
  body {
    font-family: sans-serif;
    max-width: 480px;
    margin: 0 auto;
    padding: 16px;
    color: #222;
  }
  fieldset {
    border: 1px solid #ccc;
    margin-bottom: 16px;
  }
  label {
    display: inline-block;
    margin: 4px 12px 4px 0;
  }
  input[type="number"] {
    width: 5em;
  }
  textarea {
    width: 100%;
    box-sizing: border-box;
  }
  button {
    padding: 8px 24px;
    font-size: 1rem;
  }
  /* 入力チェックのエラー(該当項目の横に表示する) */
  .fieldError, #layoutInfo.error {
    color: #c00;
    font-size: 0.85rem;
  }
  #err-labelText {
    display: block;
  }
  .invalid {
    border-color: #c00;
    outline: 1px solid #c00;
  }
  #layoutInfo {
    margin: 0 0 8px;
    font-weight: bold;
  }
  /* プリセット名が長いので画面幅に収める */
  #preset {
    max-width: 100%;
  }
  #printNote {
    color: #666;
    font-size: 0.9rem;
  }
  #message {
    white-space: pre-line;
  }
  #preview {
    display: block;
    width: 100%;
    max-width: 300px;
    border: 1px solid #999;
    background: #fff;
  }
  #previewNote {
    color: #666;
    font-size: 0.9rem;
  }
</style>
</head>
<body>
<h1>PDFラベルメーカー</h1>

<!-- 用紙の余白(mm) -->
<fieldset>
  <legend>用紙の余白(mm)</legend>
  <label>上 <input type="number" id="marginTop" value="10" min="0" step="0.1"> <span class="fieldError" id="err-marginTop"></span></label>
  <label>下 <input type="number" id="marginBottom" value="10" min="0" step="0.1"> <span class="fieldError" id="err-marginBottom"></span></label>
  <label>左 <input type="number" id="marginLeft" value="10" min="0" step="0.1"> <span class="fieldError" id="err-marginLeft"></span></label>
  <label>右 <input type="number" id="marginRight" value="10" min="0" step="0.1"> <span class="fieldError" id="err-marginRight"></span></label>
</fieldset>

<!-- ラベルのサイズ(mm) -->
<fieldset>
  <legend>ラベルのサイズ(mm)</legend>
  <label>幅 <input type="number" id="labelWidth" value="90" min="0.1" step="0.1"> <span class="fieldError" id="err-labelWidth"></span></label>
  <label>高さ <input type="number" id="labelHeight" value="40" min="0.1" step="0.1"> <span class="fieldError" id="err-labelHeight"></span></label>
</fieldset>

<!-- ラベル間の余白(mm) -->
<fieldset>
  <legend>ラベル間の余白(mm)</legend>
  <label>縦 <input type="number" id="gapVertical" value="5" min="0" step="0.1"> <span class="fieldError" id="err-gapVertical"></span></label>
  <label>横 <input type="number" id="gapHorizontal" value="5" min="0" step="0.1"> <span class="fieldError" id="err-gapHorizontal"></span></label>
</fieldset>

<!-- 用紙プリセット(選ぶと余白・ラベルサイズ・ラベル間余白を自動設定する) -->
<fieldset>
  <legend>用紙プリセット</legend>
  <!-- 入力した文字を含むプリセットだけをドロップダウンに表示する -->
  <label>絞り込み <input type="search" id="presetFilter" placeholder="例: 24面、72224、エーワン"></label>
  <br>
  <!-- 選択肢はスクリプトで PRESETS から作る -->
  <select id="preset"></select>
</fieldset>

<!-- 印字するテキストと文字の配置 -->
<fieldset>
  <legend>テキスト</legend>
  <textarea id="labelText" rows="4" placeholder="ラベルに印字する文字を入力"></textarea>
  <span class="fieldError" id="err-labelText"></span>
  <label>文字サイズ(pt) <input type="number" id="fontSize" min="0.1" step="0.1" placeholder="自動"> <span class="fieldError" id="err-fontSize"></span></label>
  <br>
  <label>左右の揃え
    <select id="alignH">
      <option value="left" selected>左</option>
      <option value="center">中央</option>
      <option value="right">右</option>
    </select>
  </label>
  <label>上下の揃え
    <select id="alignV">
      <option value="top">上</option>
      <option value="middle" selected>中央</option>
      <option value="bottom">下</option>
    </select>
  </label>
</fieldset>

<!-- A4用紙の縮小プレビュー(入力のたびに更新) -->
<fieldset>
  <legend>プレビュー</legend>
  <!-- 並べ方の計算結果(○列×○行=○枚) -->
  <p id="layoutInfo"></p>
  <canvas id="preview"></canvas>
  <p id="previewNote"></p>
</fieldset>

<!-- 試し刷り用: オンにするとPDFにもラベルの枠線を描く -->
<label><input type="checkbox" id="printBorder"> 枠線を印刷する(試し刷り用)</label>
<br>
<!-- PDF作成(フォント取得が終わるまで押せない)。作成したPDFは新しいタブで開く -->
<button type="button" id="createPdf" disabled>フォント読み込み中…</button>
<!-- 拡大・縮小して印刷するとラベルからずれるための注意書き -->
<p id="printNote">印刷するときは、倍率を「実際のサイズ(100%)」にしてください。「用紙に合わせる」などで拡大・縮小すると、ラベルからずれます。</p>
<p id="message"></p>

<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script>
// 用紙サイズ(A4, mm)
const PAPER_W = 210;
const PAPER_H = 297;
// ラベル内側の余白(mm)。文字がラベルの枠に接しないようにする
const LABEL_PADDING = 2;
// 行の高さ(文字サイズに対する倍率)
const LINE_HEIGHT = 1.2;
// 1pt = 25.4/72 mm
const PT_TO_MM = 25.4 / 72;
// 日本語フォント(BIZ UDゴシック)の読み込み元
const FONT_URL = 'https://cdn.jsdelivr.net/gh/google/fonts@01ac47e0b1cddbc298334c69a5dfafb0205ffa28/ofl/bizudgothic/BIZUDGothic-Regular.ttf';
const FONT_FILE = 'BIZUDGothic-Regular.ttf';
const FONT_NAME = 'BIZUDGothic';
// プレビュー(canvas)で使うフォント名
const PREVIEW_FONT = 'BIZUDGothicPreview';
// プレビューの縮尺(1mmあたりの画面上のピクセル数)
const PREVIEW_PX_PER_MM = 300 / PAPER_W;

const button = document.getElementById('createPdf');
const message = document.getElementById('message');
const canvas = document.getElementById('preview');
const previewNote = document.getElementById('previewNote');
const layoutInfo = document.getElementById('layoutInfo');

// 取得したフォント(Base64)。初回に1度だけ取得して使い回す
let fontBase64 = null;
// 文字幅を測るための jsPDF 文書。フォント登録は重いため1度だけ作って使い回す
let measureDoc = null;
// フォントの取得に失敗したかどうか
let fontFailed = false;

// 日本語フォントを登録した jsPDF 文書を作る
function createDocWithFont() {
  const { jsPDF } = window.jspdf;
  const doc = new jsPDF({ unit: 'mm', format: 'a4', orientation: 'portrait' });
  doc.addFileToVFS(FONT_FILE, fontBase64);
  doc.addFont(FONT_FILE, FONT_NAME, 'normal');
  doc.setFont(FONT_NAME, 'normal');
  return doc;
}

// メッセージを表示する(isError が true なら赤字)
function showMessage(text, isError) {
  message.textContent = text;
  message.style.color = isError ? '#c00' : '#222';
}

// ArrayBuffer を Base64 文字列に変換する
function arrayBufferToBase64(buffer) {
  const bytes = new Uint8Array(buffer);
  const chunkSize = 0x8000;
  let binary = '';
  // 一度に変換すると引数が多すぎるため、分割して文字列にする
  for (let i = 0; i < bytes.length; i += chunkSize) {
    binary += String.fromCharCode.apply(null, bytes.subarray(i, i + chunkSize));
  }
  return btoa(binary);
}

// ページを開いたときにフォントを取得する
async function loadFont() {
  try {
    const res = await fetch(FONT_URL);
    if (!res.ok) throw new Error('HTTP ' + res.status);
    const buffer = await res.arrayBuffer();
    fontBase64 = arrayBufferToBase64(buffer);
    // 同じフォントをプレビュー用にも登録し、PDFと見た目を揃える
    const face = new FontFace(PREVIEW_FONT, buffer);
    await face.load();
    document.fonts.add(face);
    // プレビュー用フォントの準備ができてから文字幅の計測を有効にする
    measureDoc = createDocWithFont();
    button.disabled = false;
    button.textContent = 'PDFを作成';
    updatePreview();
  } catch (e) {
    fontFailed = true;
    measureDoc = null;
    updatePreview();
    button.textContent = 'PDFを作成';
    showMessage('フォントの読み込みに失敗しました。ネットワークを確認してページを再読み込みしてください。(' + e.message + ')', true);
  }
}

// 数値入力欄の値を読む。空欄や数値以外は NaN になる
function readNumber(id) {
  const value = document.getElementById(id).value.trim();
  return value === '' ? NaN : Number(value);
}

// 入力チェックの対象(入力欄の id → 項目の種類)
// zeroOk: 0以上 / positive: 0より大きい / text: 空欄不可 / fontSize: 空欄(自動)か0より大きい
const FIELD_RULES = {
  marginTop: 'zeroOk', marginBottom: 'zeroOk', marginLeft: 'zeroOk', marginRight: 'zeroOk',
  labelWidth: 'positive', labelHeight: 'positive',
  gapVertical: 'zeroOk', gapHorizontal: 'zeroOk',
  labelText: 'text', fontSize: 'fontSize',
};
// 並べ方の計算に使う項目(ここにエラーがあると列数・行数を計算できない)
const LAYOUT_FIELDS = ['marginTop', 'marginBottom', 'marginLeft', 'marginRight',
  'labelWidth', 'labelHeight', 'gapVertical', 'gapHorizontal'];

// 1つの入力欄をチェックし、エラーならその理由を返す(問題なければ空文字)
function checkField(id, rule) {
  const el = document.getElementById(id);
  if (rule === 'text') return el.value.trim() === '' ? 'テキストを入力してください' : '';
  // 数値欄に数値以外を入れると value は空になるため、badInput で見分ける
  if (el.validity && el.validity.badInput) return '数値を入力してください';
  const value = el.value.trim();
  if (value === '') return rule === 'fontSize' ? '' : '入力してください';
  const n = Number(value);
  if (!Number.isFinite(n)) return '数値を入力してください';
  if (rule === 'zeroOk' && n < 0) return '0以上の数値を入力してください';
  if (rule !== 'zeroOk' && n <= 0) {
    return rule === 'fontSize' ? '0より大きい数値か、空欄(自動)にしてください' : '0より大きい数値を入力してください';
  }
  return '';
}

// 入力値をまとめて読み取る。fieldErrors には項目ごとのエラー理由が入る
function readSettings() {
  const fieldErrors = {};
  for (const [id, rule] of Object.entries(FIELD_RULES)) {
    const reason = checkField(id, rule);
    if (reason) fieldErrors[id] = reason;
  }
  const s = {
    marginTop: readNumber('marginTop'),
    marginBottom: readNumber('marginBottom'),
    marginLeft: readNumber('marginLeft'),
    marginRight: readNumber('marginRight'),
    labelWidth: readNumber('labelWidth'),
    labelHeight: readNumber('labelHeight'),
    gapV: readNumber('gapVertical'),
    gapH: readNumber('gapHorizontal'),
    text: document.getElementById('labelText').value,
    fontSizeText: document.getElementById('fontSize').value.trim(),
    alignH: document.getElementById('alignH').value,
    alignV: document.getElementById('alignV').value,
  };
  // 文字サイズは空欄なら自動、数値なら手動指定
  s.fontSize = s.fontSizeText === '' ? null : Number(s.fontSizeText);
  return { s, fieldErrors };
}

// 用紙に入る列数・行数を計算する
function calcLayout(s) {
  // 浮動小数点の誤差でぴったりの場合に1枚減らないよう、わずかに余裕を持たせる
  const EPS = 1e-6;
  const usableW = PAPER_W - s.marginLeft - s.marginRight;
  const usableH = PAPER_H - s.marginTop - s.marginBottom;
  const cols = Math.max(0, Math.floor((usableW + s.gapH) / (s.labelWidth + s.gapH) + EPS));
  const rows = Math.max(0, Math.floor((usableH + s.gapV) / (s.labelHeight + s.gapV) + EPS));
  return { cols, rows };
}

// ラベルに収まる最大の文字サイズ(pt)を求める
function calcMaxFontSize(doc, lines, s) {
  const innerW = s.labelWidth - LABEL_PADDING * 2;
  const innerH = s.labelHeight - LABEL_PADDING * 2;
  if (innerW <= 0 || innerH <= 0) return 0;
  // 文字サイズ1ptのときの最も長い行の幅(mm)。幅は文字サイズに比例する
  doc.setFontSize(1);
  const widestAt1pt = Math.max(...lines.map(line => doc.getTextWidth(line)));
  const sizeByWidth = widestAt1pt > 0 ? innerW / widestAt1pt : Infinity;
  const sizeByHeight = innerH / (lines.length * LINE_HEIGHT * PT_TO_MM);
  // 小数第1位で切り捨て
  return Math.floor(Math.min(sizeByWidth, sizeByHeight) * 10) / 10;
}

// 1枚のラベル内の文字の位置を求める(x, y はラベル左上の座標、単位mm)
// 戻り値: textX = 左右揃えの基準位置、lineYs = 各行の高さの中央の位置
function calcTextPositions(lines, fontSize, x, y, s) {
  const lineH = fontSize * LINE_HEIGHT * PT_TO_MM;
  const blockH = lineH * lines.length;
  const innerW = s.labelWidth - LABEL_PADDING * 2;
  const innerH = s.labelHeight - LABEL_PADDING * 2;

  // 上下の揃え: テキスト全体の上端の位置
  let top = y + LABEL_PADDING;
  if (s.alignV === 'middle') top += (innerH - blockH) / 2;
  if (s.alignV === 'bottom') top += innerH - blockH;

  // 左右の揃え: 左揃えなら左端、中央なら中央、右揃えなら右端を基準にする
  let textX = x + LABEL_PADDING;
  if (s.alignH === 'center') textX += innerW / 2;
  if (s.alignH === 'right') textX += innerW;

  const lineYs = lines.map((_, i) => top + lineH * i + lineH / 2);
  return { textX, lineYs };
}

// 各ラベルの左上の座標(mm)を順に返す。上余白・左余白を起点に左上寄せで並べる
function labelPositions(s, cols, rows) {
  const positions = [];
  for (let r = 0; r < rows; r++) {
    for (let c = 0; c < cols; c++) {
      positions.push({
        x: s.marginLeft + c * (s.labelWidth + s.gapH),
        y: s.marginTop + r * (s.labelHeight + s.gapV),
      });
    }
  }
  return positions;
}

// 入力値から、並べ方と文字サイズをまとめて計算する(プレビューとPDFで共通)
// 問題があれば error を返す。並べ方まで計算できた場合は s, cols, rows も返す(プレビューで枠だけ描くため)
// fieldErrors(項目ごとのエラー)と layoutError(ラベルが入らないエラー)は画面表示用に常に返す
function calcPlan() {
  const { s, fieldErrors } = readSettings();
  if (LAYOUT_FIELDS.some(id => fieldErrors[id])) {
    return { error: '余白・ラベルのサイズ・ラベル間の入力を確認してください。', fieldErrors };
  }
  const { cols, rows } = calcLayout(s);
  if (cols === 0 || rows === 0) {
    const layoutError = 'この設定ではラベルが1枚も入りません。余白やラベルのサイズを見直してください。';
    return { error: layoutError, layoutError, fieldErrors };
  }
  const base = { s, cols, rows, fieldErrors };
  if (fieldErrors.labelText || fieldErrors.fontSize) {
    return { ...base, error: 'テキスト・文字サイズの入力を確認してください。' };
  }
  if (!measureDoc) {
    const reason = fontFailed ? 'フォントを読み込めなかったため、文字は表示できません。' : 'フォント読み込み中…';
    return { ...base, error: reason };
  }
  // テキストエリアの改行をそのまま行として扱う
  const lines = s.text.replace(/\r\n?/g, '\n').split('\n');

  const maxSize = calcMaxFontSize(measureDoc, lines, s);
  if (maxSize <= 0) return { ...base, error: 'ラベルが小さすぎて文字を配置できません。' };
  // 手動指定がはみ出す場合は収まるサイズに縮小する
  let fontSize = maxSize;
  let warning = '';
  if (s.fontSize !== null) {
    if (s.fontSize > maxSize) {
      warning = '指定の文字サイズ(' + s.fontSize + 'pt)ではラベルからはみ出すため、' + maxSize + 'ptに縮小しました。';
    } else {
      fontSize = s.fontSize;
    }
  }
  return { ...base, lines, fontSize, warning };
}

// 項目ごとのエラー・並べ方の計算結果・ボタンの状態を画面に反映する
function showStatus(plan) {
  for (const id of Object.keys(FIELD_RULES)) {
    const reason = plan.fieldErrors[id] || '';
    document.getElementById('err-' + id).textContent = reason;
    document.getElementById(id).classList.toggle('invalid', reason !== '');
  }
  // 並べ方の計算結果(○列×○行=○枚)。計算できないときは理由を表示する
  if (plan.s) {
    layoutInfo.textContent = plan.cols + '列×' + plan.rows + '行=' + (plan.cols * plan.rows) + '枚';
    layoutInfo.classList.remove('error');
  } else {
    layoutInfo.textContent = plan.layoutError || '入力にエラーがあるため、並べ方を計算できません。';
    layoutInfo.classList.add('error');
  }
  // エラーがある間(フォント取得前・取得失敗を含む)はPDFを作成できない
  button.disabled = !!plan.error;
}

// A4用紙の縮小プレビューを描く(ラベルの枠と文字)。あわせて入力チェックの結果も表示する
function updatePreview() {
  const dpr = window.devicePixelRatio || 1;
  // 画面上のピクセル → canvas のピクセルの倍率(高解像度画面でもぼやけないようにする)
  const k = PREVIEW_PX_PER_MM * dpr;
  canvas.width = Math.round(PAPER_W * k);
  canvas.height = Math.round(PAPER_H * k);
  canvas.style.aspectRatio = PAPER_W + ' / ' + PAPER_H;
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#fff';
  ctx.fillRect(0, 0, canvas.width, canvas.height);

  const plan = calcPlan();
  showStatus(plan);
  // 並べ方が決まらない場合は用紙だけ表示する
  if (!plan.s) {
    previewNote.textContent = plan.error;
    return;
  }
  const { s, cols, rows } = plan;
  const positions = labelPositions(s, cols, rows);

  // ラベルの枠(線がにじまないよう0.5pxずらす)
  ctx.strokeStyle = '#999';
  ctx.lineWidth = 1;
  for (const { x, y } of positions) {
    ctx.strokeRect(Math.round(x * k) + 0.5, Math.round(y * k) + 0.5,
      Math.round(s.labelWidth * k) - 1, Math.round(s.labelHeight * k) - 1);
  }
  // テキストが空欄・フォント取得前などで文字を描けない場合は枠だけにする
  if (plan.error) {
    previewNote.textContent = plan.error;
    return;
  }

  // 文字(PDFと同じ文字サイズ・位置で描く)
  const { lines, fontSize, warning } = plan;
  ctx.fillStyle = '#222';
  ctx.font = (fontSize * PT_TO_MM * k) + 'px "' + PREVIEW_FONT + '"';
  ctx.textAlign = s.alignH;
  ctx.textBaseline = 'middle';
  for (const { x, y } of positions) {
    const { textX, lineYs } = calcTextPositions(lines, fontSize, x, y, s);
    lines.forEach((line, i) => ctx.fillText(line, textX * k, lineYs[i] * k));
  }
  previewNote.textContent = warning;
}

// 日時付きのファイル名を作る(例: label_20260930_1530.pdf)
function makeFileName() {
  const d = new Date();
  const pad = n => String(n).padStart(2, '0');
  return 'label_' + d.getFullYear() + pad(d.getMonth() + 1) + pad(d.getDate()) +
    '_' + pad(d.getHours()) + pad(d.getMinutes()) + '.pdf';
}

// [PDFを作成] ボタンの処理
function createPdf() {
  const plan = calcPlan();
  if (plan.error) {
    showMessage(plan.error, true);
    return;
  }
  const { s, cols, rows, lines, fontSize, warning } = plan;

  const doc = createDocWithFont();
  doc.setFontSize(fontSize);
  // 試し刷り用の枠線(細い灰色の線)
  const printBorder = document.getElementById('printBorder').checked;
  doc.setDrawColor(150);
  doc.setLineWidth(0.1);
  for (const { x, y } of labelPositions(s, cols, rows)) {
    if (printBorder) doc.rect(x, y, s.labelWidth, s.labelHeight);
    const { textX, lineYs } = calcTextPositions(lines, fontSize, x, y, s);
    lines.forEach((line, i) => {
      doc.text(line, textX, lineYs[i], { align: s.alignH, baseline: 'middle' });
    });
  }

  // PDFのタイトルに日時付きのファイル名を入れる(保存時の名前に反映されるかはブラウザ次第)
  doc.setProperties({ title: makeFileName() });
  // 作成したPDFを新しいタブで開く
  const tab = window.open(doc.output('bloburl'), '_blank');
  if (!tab) {
    showMessage('新しいタブを開けませんでした。ブラウザのポップアップブロックを解除してください。', true);
    return;
  }
  const summary = cols + '列×' + rows + '行=' + (cols * rows) + '枚、文字サイズ ' + fontSize + 'pt でPDFを作成しました。';
  showMessage(warning ? warning + '\n' + summary : summary, !!warning);
}

// 用紙プリセット(単位mm)

// エーワンの値は公式サイトの商品ページにある寸法図から読み取ったもの(2026年9月確認)
// 寸法図にない右余白・下余白は「用紙サイズ − 左(上)余白 − ラベルを並べた幅(高さ)」で求めた
const PRESET_ROWS = [
  ['aone_72201', 'エーワン 72201 A4 1面 210×297mm ノーカット', 0, 0, 0, 0, 210, 297, 0, 0],

// プリセットで設定する入力欄の id(PRESET_ROWS の3番目以降の並びと同じ順)
const PRESET_FIELDS = ['marginTop', 'marginBottom', 'marginLeft', 'marginRight',
  'labelWidth', 'labelHeight', 'gapHorizontal', 'gapVertical'];
// キー → { name, values: { 入力欄の id: 値 } }
const PRESETS = {};
for (const [key, name, ...nums] of PRESET_ROWS) {
  const values = {};
  PRESET_FIELDS.forEach((id, i) => { values[id] = nums[i]; });
  PRESETS[key] = { name, values };
}
const CUSTOM_NAME = 'カスタム(手動設定)';

const presetSelect = document.getElementById('preset');
const presetFilter = document.getElementById('presetFilter');

// 絞り込み用に文字をそろえる(全角英数→半角、大文字→小文字、x・* → ×)
function normalizeForSearch(text) {
  return text.normalize('NFKC').toLowerCase().replace(/[x*]/g, '×');
}

// 表示名が絞り込み欄の文字を含むか
// 空白区切りで複数の語を入れた場合は、すべての語を含むものだけを対象にする
function matchesFilter(name) {
  const words = normalizeForSearch(presetFilter.value).split(/\s+/).filter(w => w !== '');
  return words.every(w => normalizeForSearch(name).includes(w));
}

// いま選ばれているプリセットのキー。絞り込みで選択肢から消えても覚えておく
let currentPreset = 'custom';

// 選択肢を作り直す。絞り込み欄の文字を含むものだけを表示する
function renderPresetOptions() {
  const current = currentPreset;
  const items = [['custom', CUSTOM_NAME], ...PRESET_ROWS.map(([key, name]) => [key, name])]
    .filter(([, name]) => matchesFilter(name));

  presetSelect.innerHTML = '';
  // 選んでいたものが絞り込みで消えた場合は、件数だけの行を表示する(入力欄の値は変えない)
  if (!items.some(([key]) => key === current)) {
    const info = new Option(items.length === 0 ? '該当するプリセットがありません' : items.length + '件見つかりました。選択してください', '');
    info.disabled = true;
    info.selected = true;
    presetSelect.add(info);
  }
  for (const [key, name] of items) {
    presetSelect.add(new Option(name, key, false, key === current));
  }
}

// プリセットを選んだら入力欄に値を入れる(カスタムの場合は今の値をそのまま使う)
presetSelect.addEventListener('change', () => {
  currentPreset = presetSelect.value;
  const preset = PRESETS[currentPreset];
  if (!preset) return;
  for (const id of PRESET_FIELDS) {
    document.getElementById(id).value = preset.values[id];
  }
  updatePreview();
});

presetFilter.addEventListener('input', renderPresetOptions);

// 数値を手で変えてプリセットと値が食い違ったら、表示を「カスタム」に戻す
// (カスタムが絞り込みで隠れている場合は、絞り込みを解除して表示する)
PRESET_FIELDS.forEach(id => {
  document.getElementById(id).addEventListener('input', () => {
    const preset = PRESETS[currentPreset];
    if (preset && PRESET_FIELDS.some(f => readNumber(f) !== preset.values[f])) {
      if (!matchesFilter(CUSTOM_NAME)) presetFilter.value = '';
      currentPreset = 'custom';
      renderPresetOptions();
    }
  });
});
renderPresetOptions();

button.addEventListener('click', createPdf);
// 入力のたびにプレビューを更新する
document.querySelectorAll('input, textarea, select').forEach(el => {
  el.addEventListener('input', updatePreview);
});
updatePreview();
loadFont();
</script>
